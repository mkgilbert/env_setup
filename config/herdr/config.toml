onboarding = false

[update]
version_check = false
manifest_check = false

[ui]
prompt_new_tab_name = false

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/mgilbert/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
split_vertical = ["prefix+v", "prefix+|"]
reload_config = "prefix+shift+r"
resize_mode = "prefix+e"

# cross-machine navigation (works across local + saved ssh machines)
previous_workspace = "prefix+comma"
next_workspace = "prefix+period"
previous_agent = "prefix+shift+a"
next_agent = "prefix+a"
focus_agent = "prefix+alt+1..9"

[remote]
manage_ssh_config = false

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id> — note the id, not the name

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

